[package]
name = "usher-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-daemon, SSH-bootstrapped Linux and Windows screen, audio, and input host for Usher"

[[bin]]
name = "usher-host"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
blake3.workspace = true
clap.workspace = true
openh264.workspace = true
openh264-sys2 = { version = "0.9", default-features = false }
rusty-opus.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
usher-proto = { path = "../usher-proto" }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
evdev.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal.workspace = true
serde.workspace = true
serde_json.workspace = true
vigem-client.workspace = true
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
