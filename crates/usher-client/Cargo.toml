[package]
name = "usher-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight SSH-bootstrapped GPU remote desktop and game client for Usher"

[[bin]]
name = "usher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
blake3.workspace = true
clap.workspace = true
cpal.workspace = true
gilrs.workspace = true
openh264.workspace = true
rusty-opus.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
usher-proto = { path = "../usher-proto" }
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
