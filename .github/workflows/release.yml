name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            package_args: ""
          - name: linux-x86_64
            os: ubuntu-latest
            package_args: ""
          - name: macos-aarch64
            os: macos-latest
            package_args: "-p usher-client"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release ${{ matrix.package_args }}

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bundle | Out-Null
          Copy-Item target/release/usher.exe dist/bundle/usher.exe
          Copy-Item target/release/usher-host.exe dist/bundle/usher-host.exe
          Copy-Item contrib/install-windows.ps1 dist/bundle/install-windows.ps1
          Copy-Item contrib/install-windows.cmd dist/bundle/install-windows.cmd
          Copy-Item README.md dist/bundle/README.md
          Compress-Archive -Path dist/bundle/* -DestinationPath dist/usher-windows-x86_64.zip -Force
          Remove-Item -Recurse -Force dist/bundle

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          foreach ($cand in @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )) {
            if (-not $iscc -and (Test-Path $cand)) {
              $iscc = $cand
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            foreach ($cand in @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 7\ISCC.exe"
            )) {
              if (Test-Path $cand) {
                $iscc = $cand
                break
              }
            }
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) not found"
          }

          $rawTag = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart('v')
          $appVer = if ($rawTag -match '^\d+\.\d+\.\d+') { $rawTag } else { "0.3.1" }
          $numVer = ([regex]::Match($appVer, '^\d+\.\d+\.\d+')).Value

          & $iscc `
            "/DAppVersion=$appVer" `
            "/DVersionInfoVersion=$numVer" `
            "/DBinDir=$((Resolve-Path target\release).Path)" `
            "/DRepoRoot=$((Resolve-Path .).Path)" `
            "/O$((Resolve-Path dist).Path)" `
            contrib\usher.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path dist\usher-setup-windows-x86_64.exe)) {
            throw "Expected installer dist\usher-setup-windows-x86_64.exe was not generated"
          }

      - name: Package Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/bundle
          cp target/release/usher dist/bundle/usher
          cp target/release/usher-host dist/bundle/usher-host
          cp contrib/99-usher-uinput.rules dist/bundle/99-usher-uinput.rules
          cp contrib/install-host.sh dist/bundle/install-host.sh
          cp README.md dist/bundle/README.md
          tar -C dist/bundle -czf dist/usher-linux-x86_64.tar.gz .
          rm -rf dist/bundle

      - name: Package macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/bundle
          cp target/release/usher dist/bundle/usher
          cp README.md dist/bundle/README.md
          tar -C dist/bundle -czf dist/usher-macos-aarch64.tar.gz .
          rm -rf dist/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
