name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, Test & Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run unit & E2E tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Headless local decode smoke test
        run: |
          cargo build --bin usher --bin usher-host
          ./target/debug/usher --local --capture testsrc --no-audio --no-input --no-clipboard --smoke-frames 5

      - name: Verify Windows Setup installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --bin usher --bin usher-host
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build failed with exit code $LASTEXITCODE"
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          foreach ($cand in @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )) {
            if (-not $iscc -and (Test-Path $cand)) {
              $iscc = $cand
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            foreach ($cand in @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 7\ISCC.exe"
            )) {
              if (Test-Path $cand) {
                $iscc = $cand
                break
              }
            }
          }
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) not found"
          }
          $outDir = Join-Path $env:RUNNER_TEMP "usher-setup-test"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & $iscc `
            "/DBinDir=$((Resolve-Path target\debug).Path)" `
            "/DRepoRoot=$((Resolve-Path .).Path)" `
            "/O$outDir" `
            contrib\usher.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }
